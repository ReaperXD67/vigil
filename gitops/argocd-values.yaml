# Temporary, private review controller. Production remains Helm-managed.
# Pinned by scripts/deploy-gitops.sh: argo-cd 10.10.5 / Argo CD v3.5.5.
createClusterRoles: false
crds:
  install: true
  keep: true
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
configs:
  cm:
    admin.enabled: false
    users.anonymous.enabled: true
    exec.enabled: false
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 5s
    resource.inclusions: |
      - apiGroups: [""]
        kinds: [ConfigMap, Service, Pod, Endpoints]
        clusters: ["https://kubernetes.default.svc"]
      - apiGroups: [apps]
        kinds: [Deployment, ReplicaSet]
        clusters: ["https://kubernetes.default.svc"]
      - apiGroups: [batch]
        kinds: [Job]
        clusters: ["https://kubernetes.default.svc"]
      - apiGroups: [policy]
        kinds: [PodDisruptionBudget]
        clusters: ["https://kubernetes.default.svc"]
      - apiGroups: [networking.k8s.io]
        kinds: [NetworkPolicy]
        clusters: ["https://kubernetes.default.svc"]
  params:
    server.insecure: true
    controller.status.processors: "2"
    controller.operation.processors: "1"
    reposerver.parallelism.limit: "1"
  rbac:
    policy.default: role:preview-reader
    policy.csv: |
      p, role:preview-reader, applications, get, vigil-preview/*, allow
      p, role:preview-reader, projects, get, vigil-preview, allow
  clusterCredentials:
    preview-local:
      server: https://kubernetes.default.svc
      namespaces: vigil-preview
      clusterResources: false
      # In-cluster authentication uses the projected ServiceAccount token.
      # No long-lived token or AWS credential is committed.
      config:
        tlsClientConfig:
          insecure: false
controller:
  replicas: 1
  dynamicClusterDistribution: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
repoServer:
  replicas: 1
  automountServiceAccountToken: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
redis:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
