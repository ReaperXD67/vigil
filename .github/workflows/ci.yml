name: Quality and containers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install API test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated API tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Verify AWS Free-plan spending guard without network access
        working-directory: .
        run: python scripts/deploy-terraform-test.py
      - name: Preserve test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  postgres:
    name: PostgreSQL migrations and API smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vigil_ci
          POSTGRES_USER: vigil_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigil_ci -d vigil_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://vigil_ci:ephemeral-ci-only@localhost:5432/vigil_ci
      APP_ENV: development
      COOKIE_SECURE: 'false'
      CHECK_WORKER_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply schema migrations to a clean PostgreSQL database
        run: alembic upgrade head
      - name: Verify persistence and CRUD with the PostgreSQL driver
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              assert client.get('/ready').status_code == 200
              session = client.post('/api/auth/demo', json={})
              assert session.status_code in (200, 201), session.text
              response = client.post('/api/tasks', json={'title': 'PostgreSQL migration smoke'})
              assert response.status_code == 201, response.text
              task_id = response.json()['id']
              assert client.get(f'/api/tasks/{task_id}').status_code == 200
              updated = client.put(f'/api/tasks/{task_id}', json={'status': 'done'})
              assert updated.status_code == 200, updated.text
              assert updated.json()['status'] == 'done'
              assert client.delete(f'/api/tasks/{task_id}').status_code in (200, 204)
              assert client.get(f'/api/tasks/{task_id}').status_code == 404
              upstream_id = client.get('/api/services').json()[0]['id']
              created = client.post('/api/services', json={'name': 'PostgreSQL dependency smoke', 'url': 'https://example.com'})
              assert created.status_code == 201, created.text
              dependent_id = created.json()['id']
              edge = client.post('/api/dependencies', json={'upstream_id': upstream_id, 'service_id': dependent_id})
              assert edge.status_code == 201, edge.text
              edge_id = edge.json()['id']
              assert client.get(f'/api/dependencies/{edge_id}').status_code == 200
              cycle = client.post('/api/dependencies', json={'upstream_id': dependent_id, 'service_id': upstream_id})
              assert cycle.status_code == 409, cycle.text
              assert client.delete(f'/api/services/{dependent_id}').status_code == 200
              assert client.get(f'/api/dependencies/{edge_id}').status_code == 404
              assert client.get('/metrics').status_code == 200
          print('PostgreSQL migrations, session, task CRUD, dependency cycle rejection/cascade, readiness and metrics verified.')
          PY
      - name: Verify migration can roll back and reapply
        run: |
          alembic downgrade base
          alembic upgrade head

  containers:
    name: Build, scan and publish immutable images
    needs: [backend, frontend, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve lowercase registry namespace
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Validate the complete local stack definition
        run: docker compose config --quiet
      - name: Build both runtime images
        id: build
        run: |
          docker build --pull --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "${IMAGE_PREFIX}-backend:${GITHUB_SHA}" ./backend
          docker build --pull --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "${IMAGE_PREFIX}-frontend:${GITHUB_SHA}" ./frontend
      - name: Start the complete stack from the images being scanned
        run: |
          docker tag "${IMAGE_PREFIX}-backend:${GITHUB_SHA}" vigil-backend:latest
          docker tag "${IMAGE_PREFIX}-frontend:${GITHUB_SHA}" vigil-frontend:latest
          docker compose up --no-build --wait --wait-timeout 120
      - name: Verify runtime isolation and persistent browser-facing API
        run: |
          test "$(docker compose exec -T backend id -u)" != 0
          test "$(docker compose exec -T frontend id -u)" != 0
          python .github/scripts/compose-smoke.py
      - name: Preserve complete-stack runtime evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100
      - name: Stop and remove the disposable CI database
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker compose down --volumes
      - name: Fail on backend HIGH or CRITICAL vulnerabilities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          version: v0.76.0
          format: table
          output: trivy-backend.txt
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Fail on frontend HIGH or CRITICAL vulnerabilities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          version: v0.76.0
          format: table
          output: trivy-frontend.txt
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Show scan findings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          for report in trivy-backend.txt trivy-frontend.txt; do
            if [ -f "$report" ]; then cat "$report"; fi
          done
      - name: Preserve security scan evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-reports
          path: trivy-*.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish both scanned images to GHCR
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE_PREFIX}-backend:${GITHUB_SHA}"
          docker push "${IMAGE_PREFIX}-frontend:${GITHUB_SHA}"
          docker logout ghcr.io
