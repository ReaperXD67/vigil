{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: vigil-limit}
spec:
  rateLimit:
    average: {{ .Values.ingress.rateLimitPerMinute }}
    period: 1m
    burst: 60
{{- if .Values.ingress.tls }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: vigil-https}
spec:
  redirectScheme: {scheme: https, permanent: true}
{{- end }}
{{- end }}
