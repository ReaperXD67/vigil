apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-frontend
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: frontend}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ required "frontend.tag must identify a published commit image" .Values.frontend.tag }}"
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /, port: http}, periodSeconds: 3, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 15}
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
        - {name: cache, emptyDir: {sizeLimit: 32Mi}}
        - {name: run, emptyDir: {sizeLimit: 8Mi}}
        - {name: config, configMap: {name: vigil-nginx}}
---
apiVersion: v1
kind: Service
metadata: {name: vigil-frontend}
spec:
  selector: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: vigil-nginx}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      server_tokens off;
      client_max_body_size 1m;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      location /api/ {
        proxy_pass http://vigil-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
      }
      location = /metrics { return 404; }
      location = /api/metrics { return 404; }
      location = /health { proxy_pass http://vigil-backend:8000; }
      location = /ready { proxy_pass http://vigil-backend:8000; }
      location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
      location / { try_files $uri $uri/ /index.html; }
    }
