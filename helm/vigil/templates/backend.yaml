apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-backend
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: backend}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ required "backend.tag must identify a published commit image" .Values.backend.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--limit-concurrency", "100"]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{secretRef: {name: {{ .Values.existingSecret }}}}]
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-backend
  labels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: backend, vigil-metrics: "true"}
spec:
  selector: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: backend}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: vigil-backend}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: vigil, app.kubernetes.io/component: backend}
